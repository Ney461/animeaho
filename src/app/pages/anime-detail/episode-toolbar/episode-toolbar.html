<div class="pt-4 flex items-center justify-between gap-4 w-full pb-4">
  <div class="flex items-center gap-2">
    <p class="font-title text-xl font-bold">EPISODIOS</p>
    <label
      class="swap btn btn-square h-10 w-10 border-none bg-anime-button text-white hover:bg-anime-button-active"
    >
      <input type="checkbox" [checked]="descending()" (change)="toggleOrder()" />

      <!-- Ascending: first to last -->
      <svg class="swap-off size-7" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
        <path d="M0 0h16v16H0z" fill="none" />
        <path
          fill="#fff"
          d="M3.5 3.5a.5.5 0 0 0-1 0v8.793l-1.146-1.147a.5.5 0 0 0-.708.708l2 1.999l.007.007a.497.497 0 0 0 .7-.006l2-2a.5.5 0 0 0-.707-.708L3.5 12.293zm4 .5a.5.5 0 0 1 0-1h1a.5.5 0 0 1 0 1zm0 3a.5.5 0 0 1 0-1h3a.5.5 0 0 1 0 1zm0 3a.5.5 0 0 1 0-1h5a.5.5 0 0 1 0 1zM7 12.5a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 0-1h-7a.5.5 0 0 0-.5.5"
        />
      </svg>

      <!-- Descending: last to first -->
      <svg class="swap-on size-7" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
        <path d="M0 0h16v16H0z" fill="none" />
        <path
          fill="#fff"
          d="M3.5 2.5a.5.5 0 0 0-1 0v8.793l-1.146-1.147a.5.5 0 0 0-.708.708l2 1.999l.007.007a.497.497 0 0 0 .7-.006l2-2a.5.5 0 0 0-.707-.708L3.5 11.293zm3.5 1a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5M7.5 6a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1zm0 3a.5.5 0 0 0 0 1h3a.5.5 0 0 0 0-1zm0 3a.5.5 0 0 0 0 1h1a.5.5 0 0 0 0-1z"
        />
      </svg>
    </label>
  </div>

  <div class="flex items-center gap-2">
    <div class="w-38 sm:w-42">
      <label
        class="input h-10 w-full gap-2 bg-anime-surface font-title border-4 border-transparent shadow-none focus-within:border-anime-focus focus-within:outline-none"
      >
        <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <g
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="2.5"
            fill="none"
            stroke="currentColor"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </g>
        </svg>
        <input
          type="number"
          placeholder="Buscar episodio"
          [value]="episodeQuery()"
          (input)="onSearch($event)"
          class="min-w-0 grow outline-none [appearance:textfield] [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none"
        />
      </label>
    </div>
    <label
      class="swap btn bg-anime-button hover:bg-anime-button-active"
      [class.btn-disabled]="!cleanNumberEp()"
      (click)="clear()"
    >
      <input
        type="checkbox"
        class="pointer-events-none"
        [checked]="cleanNumberEp()"
        tabindex="-1"
      />

      <svg class="swap-on size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
        <path
          fill="currentColor"
          d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5M8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5m3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0"
        />
      </svg>

      <svg class="swap-off size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
        <g fill="currentColor">
          <path
            d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"
          />
          <path
            d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4L4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"
          />
        </g>
      </svg>
    </label>
  </div>
</div>

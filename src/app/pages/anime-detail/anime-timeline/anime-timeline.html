<div
  class="overflow-x-auto mt-4 rounded-xl border border-anime-button/30 bg-anime-main-background/60 px-4 pt-6 pb-4"
>
  <ul class="timeline timeline-horizontal w-max min-w-full">
    @for (item of related(); track item.slug) {
      <li class="w-44 shrink-0 grid-rows-[auto_auto_auto]">
        @if (!$first) {
          <hr class="bg-anime-button/60!" />
        }

        <div class="timeline-start text-sm font-semibold text-anime-text">{{ item.year }}</div>

        <div class="timeline-middle text-anime-cyan drop-shadow-[0_0_6px_#22d3ee]">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            class="h-5 w-5"
          >
            <path
              fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z"
              clip-rule="evenodd"
            />
          </svg>
        </div>

        <a
          class="timeline-end timeline-box flex w-40 min-w-0 flex-col gap-2 overflow-hidden rounded-lg border border-anime-button/30 bg-anime-surface p-2 transition duration-200 hover:-translate-y-1 hover:border-anime-cyan hover:bg-anime-list-hover hover:shadow-lg hover:shadow-anime-cyan/10"
          [routerLink]="['/anime', item.slug]"
          [title]="item.title"
        >
          <figure class="mx-auto w-20">
            <img
              [src]="item.cover | imageFallback"
              class="aspect-2/3 w-full rounded-md object-cover"
              loading="lazy"
            />
          </figure>
          <p class="w-full truncate text-center font-title text-sm font-bold">{{ item.title }}</p>
          <span
            class="badge badge-sm badge-outline mx-auto w-fit border-anime-cyan/50 text-anime-cyan"
          >
            {{ item.relation }}
          </span>
        </a>

        @if (!$last) {
          <hr class="bg-anime-button/60!" />
        }
      </li>
    }
  </ul>
</div>

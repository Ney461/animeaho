<div class="px-4 py-2">
  <figure class=" mx-auto w-40 lg:w-full">
    <img [src]="animeCover() | imageFallback" class="w-full aspect-2/3 object-cover rounded-md" />
  </figure>

  <div
    class="bg-anime-surface flex flex-col items-center justify-center p-5 mt-5 w-full rounded-md"
  >
    <p class="font-title">Puntuación: {{ rating() }} / 10</p>
    <start-rating [rating]="rating()" />
  </div>
  <div
    class="bg-anime-surface flex flex-col items-center justify-center p-5 mt-5 w-full rounded-md"
  >
    <div class="flex items-center gap-2">
      <span class="text-2xl" [innerHTML]="status() | statusSvg"></span>
      <p class="font-title">{{ status() }}</p>
    </div>
  </div>
</div>

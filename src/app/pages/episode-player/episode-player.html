@if (loadError()) {
  <app-error-message message="No se pudo cargar el episodio." />
} @else {
  <div class="mx-auto w-full max-w-4xl">
    @if (episodeData(); as episode) {
      <p class="font-title text-2xl py-4 text-center">{{ episode.data.title }}</p>
      <server-selector [embeds]="episode.data.embeds" />
    } @else {
      <app-spinner />
    }

    <episode-navigation [currentNumber]="number()" [slug]="slug()" />
  </div>
}

<form [formGroup]="filtersForm">
  <!-- Desktop -->
  <div class="hidden lg:grid grid-cols-5 xl:px-40 lg:px-4 gap-2 place-items-center">
    <filter-options
      formControlName="tipo"
      filterLabel="Tipo"
      [options]="typeOptions"
      variant="dropdown"
    />
    <filter-options
      formControlName="genero"
      filterLabel="Género"
      [options]="genreOptions"
      variant="dropdown"
    />
    <filter-options
      formControlName="estado"
      filterLabel="Estado"
      [options]="statusOptions"
      defaultOption="finished"
      variant="dropdown"
    />
    <filter-options
      formControlName="orden"
      filterLabel="Orden"
      [options]="orderOptions"
      defaultOption="default"
      variant="dropdown"
    />
    <a class="btn btn-sm w-full bg-anime-button" (click)="sendFilters()">Filtrar </a>
  </div>

  <!-- Mobile -->
  <div class="lg:hidden">
    <button class="btn w-full m-1 bg-anime-button" (click)="modalFiltros.showModal()">
      Filtros
    </button>
    <dialog #modalFiltros class="modal modal-bottom">
      <div class="modal-box pt-12 bg-anime-surface">
        <form method="dialog">
          <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
        </form>
        <div class="flex flex-col gap-2">
          <filter-options
            formControlName="tipo"
            filterLabel="Tipo"
            [options]="typeOptions"
            variant="collapse"
            [expanded]="activeMobileFilter() === 'Tipo'"
            (expandedChange)="onMobileFilterExpansionChange('Tipo', $event)"
          />
          <filter-options
            formControlName="genero"
            filterLabel="Género"
            [options]="genreOptions"
            variant="collapse"
            [expanded]="activeMobileFilter() === 'Género'"
            (expandedChange)="onMobileFilterExpansionChange('Género', $event)"
          />
          <filter-options
            formControlName="estado"
            filterLabel="Estado"
            [options]="statusOptions"
            defaultOption="finished"
            variant="collapse"
            [expanded]="activeMobileFilter() === 'Estado'"
            (expandedChange)="onMobileFilterExpansionChange('Estado', $event)"
          />
          <filter-options
            formControlName="orden"
            filterLabel="Orden"
            [options]="orderOptions"
            defaultOption="default"
            variant="collapse"
            [expanded]="activeMobileFilter() === 'Orden'"
            (expandedChange)="onMobileFilterExpansionChange('Orden', $event)"
          />
          <button
            type="button"
            class="btn bg-anime-button"
            (click)="
              sendFilters();
              modalFiltros.close()
              "
            >
              Filtrar
            </button>
        </div>
      </div>
    </dialog>
  </div>
</form>

<div class="mx-5 flex flex-1 flex-col pt-4 px-4">

  <filter-bar (selectedFilters)="catchFilters($event)"></filter-bar>

  <div class="w-full min-w-0 xl:px-40 lg:px-4">
    @if (loading()) {
      <app-spinner></app-spinner>
    }@else {
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4 p-4">
        @for (anime of animeList().data?.media; track anime.slug) {
          <div class="card bg-anime-navy rounded-2xl overflow-hidden w-full shrink-0">
            <anime-card [anime]="anime"></anime-card>
          </div>
        }
      </div>
    }
  </div>

  <pagination [totalPages]=totalPages() class="mt-auto py-5"></pagination>



</div>

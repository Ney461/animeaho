<div class="mx-5 flex flex-1 flex-col pt-4 px-4">
  <filter-bar (selectedFilters)="catchFilters($event)" />

  <div class="w-full min-w-0 xl:px-40 lg:px-4 flex-1 flex flex-col">
    @if (loadError(); as error) {
      <app-error-message [message]="error" />
    } @else if (catalog(); as data) {
      @if (data.media.length === 0) {
        <app-error-message message="No se encontraron animes. Prueba con otros filtros" />
      } @else {
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4 p-4">
          @for (anime of data.media; track anime.slug) {
            <div class="card bg-anime-navy rounded-2xl overflow-hidden w-full shrink-0">
              <anime-card [anime]="anime" />
            </div>
          }
        </div>
      }
    } @else {
      <div class="flex-1 flex items-center justify-center p-8">
        <app-spinner />
      </div>
    }
  </div>

  @if (catalog(); as data) {
    <pagination [totalPages]="data.foundPages.toString()" class="mt-auto py-5" />
  }
</div>

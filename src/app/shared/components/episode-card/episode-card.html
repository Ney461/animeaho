<a>
  <figure class="relative cursor-pointer">
    <img
      [src]="episode().thumbnail || fallbackImage"
      class="w-full h-35 object-cover hover:scale-125 hover:brightness-110"
      [alt]="episode().title"
    />
    <span class="badge badge-info text-white absolute left-2 bottom-2 font-bold">
      Episodio {{episode()?.number}}
  </span>
  </figure>
</a>
<div class="p-3">
  <p class="text-white font-title font-semibold truncate">{{ episode()?.title }}</p>
</div>

<a>
  <figure class="relative cursor-pointer">
    <img
      [src]="anime().cover || fallbackImage"
      class="w-full h-80 object-cover hover:scale-110 hover:brightness-110"
      alt=""
    />
    <span class="badge badge-info text-white absolute left-2 bottom-2 font-bold">{{ anime().type }}</span>
  </figure>
</a>
<div class="p-3">
  <p class="text-white font-title font-semibold">{{ anime().title }}</p>
</div>

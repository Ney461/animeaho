<div class="relative min-w-0 w-full max-w-full lg:w-100">
  <div
    class="join min-w-0 w-full max-w-full rounded-field border-4 border-transparent focus-within:border-anime-focus lg:w-100"
  >
    <input
      type="text"
      (keydown.enter)="goToCatalog()"
      placeholder="Buscar"
      [value]="query()"
      (input)="onQueryInput($event)"
      class="input h-10 min-w-0 w-full flex-1 bg-anime-surface join-item border-none focus:outline-none focus:ring-0 font-title"
    />

    <label
      class="search-action swap btn h-10 w-10 shrink-0 join-item bg-anime-button p-0 border-none hover:bg-anime-button-active"
      [class.btn-disabled]="!cleanSearch()"
      (click)="clear()"
    >
      <input
        type="checkbox"
        class="pointer-events-none"
        [checked]="cleanSearch()"
        tabindex="-1"
      />

      <svg class="swap-on size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
        <path
          fill="currentColor"
          d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5M8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5m3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0"
        />
      </svg>

      <svg class="swap-off size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
        <g fill="currentColor">
          <path
            d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"
          />
          <path
            d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4L4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"
          />
        </g>
      </svg>
    </label>

    <button
      class="search-action btn h-10 w-10 shrink-0 join-item bg-anime-button p-0 border-none hover:bg-anime-button-active"
      (click)="goToCatalog()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 20 20">
        <path d="M0 0h20v20H0z" fill="none" />
        <path
          fill="currentColor"
          d="M12.14 4.18a5.504 5.504 0 0 1 .72 6.89c.12.1.22.21.36.31c.2.16.47.36.81.59c.34.24.56.39.66.47c.42.31.73.57.94.78c.32.32.6.65.84 1c.25.35.44.69.59 1.04c.14.35.21.68.18 1q-.03.48-.36.81c-.33.33-.49.34-.81.36c-.31.02-.65-.04-.99-.19c-.35-.14-.7-.34-1.04-.59c-.35-.24-.68-.52-1-.84c-.21-.21-.47-.52-.77-.93c-.1-.13-.25-.35-.47-.66c-.22-.32-.4-.57-.56-.78c-.16-.2-.29-.35-.44-.5a5.5 5.5 0 0 1-6.44-.98c-2.14-2.15-2.14-5.64 0-7.78a5.5 5.5 0 0 1 7.78 0m-1.41 6.36a3.513 3.513 0 0 0 0-4.95a3.495 3.495 0 0 0-4.95 0a3.495 3.495 0 0 0 0 4.95a3.495 3.495 0 0 0 4.95 0"
        />
      </svg>
    </button>

  </div>

  @if (showResultsDropdown()) {
    <div class="absolute top-full left-0 w-full z-50 mt-1">
      <search-dropdown
        [results]="results()"
        (selected)="query.set('')"
        (seeAll)="goToCatalog()"
      >
      </search-dropdown>
    </div>
  } @else if (showNoResults()) {
    <div class="absolute top-full left-0 w-full z-50 mt-1 rounded-box bg-anime-surface p-4 text-center font-title shadow-md">
      No se encontraron animes.
    </div>
  }

</div>
